# Overlay: expose the gateway on an ephemeral Cloudflare "quick tunnel".
# No Cloudflare account or login required; the public hostname is a random
# *.trycloudflare.com that changes every restart.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.quick.yml up -d gateway cloudflared-quick
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.quick.yml logs cloudflared-quick
#
# For a stable hostname on your own domain use the `cloudflared` service in
# deploy/docker-compose.yml instead (see deploy/cloudflared/finish-setup.sh).
name: genesis-mesh-gateway

services:
  cloudflared-quick:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
