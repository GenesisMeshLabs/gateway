# Replace the policy volume in the StatefulSet with this fragment after your
# platform team creates the namespaced SecretProviderClass and workload identity.
# Install the CSI driver and the chosen vault provider before applying.
volumes:
  - name: policy
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: gateway-organization-secrets
# Expected mounted filenames: policy.json, redis.url; optionally oidc.json,
# audit.token, server.crt, server.key, client-ca.crt. Configure corresponding
# GATEWAY_*_FILE variables. Rotation requires a controlled gateway restart.
