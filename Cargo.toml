[package]
name = "genesis-mesh-gateway"
version = "0.57.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Concurrent HTTP gateway for Genesis Mesh portable trust â€” Ed25519 identities, signed join certificates, revocation, and trust evaluation, implemented in Rust and exposed as a JSON API."
repository = "https://github.com/GenesisMeshLabs/gateway"
readme = "README.md"
keywords = ["genesis-mesh", "trust", "gateway", "ed25519", "mesh"]
categories = ["cryptography", "authentication", "web-programming::http-server"]

# The trust primitives are still a library. `genesis-mesh` stays the crate name
# so `use genesis_mesh::...` keeps working for the CLI, tests, and doctests.
[lib]
name = "genesis_mesh"
path = "src/lib.rs"

# The gateway is the primary binary.
[[bin]]
name = "genesis-mesh-gateway"
path = "src/main.rs"

# The local trust CLI is kept for shell use and cross-checking.
[[bin]]
name = "genesis-mesh"
path = "src/bin/genesis_mesh.rs"

[[bin]]
name = "genesis-mesh-operator"
path = "src/bin/genesis_mesh_operator.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ed25519-dalek = "3"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Gateway layer.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
tracing-appender = "0.2"
arc-swap = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4.3"
jsonwebtoken = "9"
redis = { version = "0.27", features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"

[dev-dependencies]
http-body-util = "0.1"
rcgen = "0.13"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
