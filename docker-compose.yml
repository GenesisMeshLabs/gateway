name: genesis-mesh-gateway

services:
  # The trust core, served as a JSON API.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: genesis-mesh-gateway:latest
    restart: unless-stopped
    environment:
      GATEWAY_ADDR: 0.0.0.0:8080
      GATEWAY_POLICY_FILE: /run/gateway/policy.json
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-15000}
      GATEWAY_MAX_INFLIGHT: ${GATEWAY_MAX_INFLIGHT:-32}
      GATEWAY_MAX_BATCH: ${GATEWAY_MAX_BATCH:-128}
      GATEWAY_CPU_WORKERS: ${GATEWAY_CPU_WORKERS:-2}
      GATEWAY_MAX_BATCH_JOBS: ${GATEWAY_MAX_BATCH_JOBS:-1}
      TOKIO_WORKER_THREADS: ${TOKIO_WORKER_THREADS:-2}
      TOKIO_MAX_BLOCKING_THREADS: ${TOKIO_MAX_BLOCKING_THREADS:-16}
      RUST_LOG: ${GATEWAY_LOG_FILTER:-info,tower_http=info}
    volumes:
      - ./.local/policy.json:/run/gateway/policy.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: 2
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    ports:
      # Loopback only. The public path is the Cloudflare tunnel, which reaches
      # this container over the compose network as http://gateway:8080.
      - "127.0.0.1:8080:8080"

  # Cloudflare tunnel connector (named tunnel). Ingress in
  # ./cloudflared/config.yml, credentials in ./cloudflared/credentials.json,
  # both produced by the one-time steps in cloudflared/finish-setup.sh.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      gateway:
        condition: service_healthy
