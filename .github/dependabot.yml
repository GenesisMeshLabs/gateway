version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ['*']}
    open-pull-requests-limit: 2
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
    groups:
      compatible: {patterns: ['*'], update-types: [minor, patch]}
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
  # The Compose files pin redis and cloudflared by digest; keep them current.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
