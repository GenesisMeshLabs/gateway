name: Security source analysis
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '21 4 * * 1'
permissions:
  contents: read
concurrency:
  group: security-analysis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    # Code scanning for private repositories needs GitHub Advanced Security,
    # which the Free plan does not include; run only while the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
  # A stable name for the ruleset over the language matrix. CodeQL is skipped
  # only while the repository is private; otherwise skipped is a failure.
  codeql-summary:
    name: CodeQL
    if: always()
    needs: [codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Every language was analyzed
        env:
          RESULT: ${{ needs.codeql.result }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          echo "codeql: $RESULT (private: $PRIVATE)"
          if [ "$RESULT" = success ] || { [ "$RESULT" = skipped ] && [ "$PRIVATE" = true ]; }; then exit 0; fi
          echo "::error::CodeQL did not pass for every language ($RESULT)."
          exit 1
