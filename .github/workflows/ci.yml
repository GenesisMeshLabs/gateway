name: Rust gateway
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # The merge queue tests each PR on top of main and what is ahead of it.
  merge_group:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "24"}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      # Every console test file runs; finding none is a failure, not a pass.
      - name: Console tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tools/test_ui_*.mjs)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::No console tests (tools/test_ui_*.mjs) found."
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "== $test"
            node "$test"
          done
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      # A filter that matches no test passes silently: require that some ran.
      - name: Canonical JSON tests with serde_json preserve_order
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --features serde_json/preserve_order --lib canonical::tests 2>&1 | tee canonical.log
          if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed' canonical.log; then
            echo "::error::The canonical::tests filter ran no test."
            exit 1
          fi
      - run: cargo build --locked --release --bin genesis-mesh-gateway
  container:
    name: Gateway image with the Network Authority image on ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A coordinated change is tested against the core branch of the same
      # name when it exists, and against main otherwise.
      - name: Choose the core revision
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # A release tag is checked against the core release of the same version
          # (the core leads the train), never core main, which may already be ahead.
          ref=main
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ref="$GITHUB_REF_NAME"
          elif git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$BRANCH" > /dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing with core revision: $ref"
          echo "CORE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: ${{ env.CORE_REF }}
          path: core
      # Missing vectors or harness fail the job: skipped is not green.
      - name: The console's signing vectors are the core's
        run: cmp core/conformance/vectors/admin_auth.json tests/reference/admin_auth.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}
      # BuildKit and the Dockerfile's base images (pinned by digest) come through
      # mirrors, falling back to Docker Hub: its outages failed every image job.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      # Each architecture builds and runs natively on its own runner.
      - name: Build both images
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          docker buildx build --load -t genesis-mesh-gateway:ci --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" .
          docker buildx build --load -t genesis-mesh:ci --build-arg VERSION="$(tr -d '[:space:]' < core/VERSION)" core
      - name: Container smoke tests (gateway scenarios and the compose example)
        env:
          GM_E2E_REQUIRED: "1"
        run: |
          if [ ! -f core/scripts/container_smoke.py ]; then
            echo "::error::The core revision $CORE_REF has no container smoke harness (core/scripts/container_smoke.py)."
            exit 1
          fi
          python core/scripts/container_smoke.py --image genesis-mesh:ci --gateway-image genesis-mesh-gateway:ci \
            --compose-file core/deploy/compose/docker-compose.images.yml \
            --only gw-metadata --only gw-end-to-end --only gw-crl-refresh --only fed-two-sovereigns --only compose-example
  # Stable names for the ruleset: each fails unless every matrix member passed.
  verify-summary:
    name: Verify
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Every platform passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "verify: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then echo "::error::verify did not pass on every platform ($result)."; exit 1; fi
          done
  container-summary:
    name: Network Authority end-to-end
    if: always()
    needs: [container]
    runs-on: ubuntu-latest
    steps:
      - name: Every architecture passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "container: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then echo "::error::The end-to-end run did not pass on every architecture ($result)."; exit 1; fi
          done
  catalog:
    name: Authority catalog and signing vectors match the core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A coordinated change is checked against the core branch of the same
      # name when it exists, and against main otherwise.
      - name: Choose the core revision
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # A release tag is checked against the core release of the same version
          # (the core leads the train), never core main, which may already be ahead.
          ref=main
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ref="$GITHUB_REF_NAME"
          elif git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$BRANCH" > /dev/null; then
            ref="$BRANCH"
          fi
          echo "Checking against core revision: $ref"
          echo "CORE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: python tests/reference/build_service_catalog.py --core core --check
      - name: Admin signature vectors are the core's
        run: cmp core/conformance/vectors/admin_auth.json tests/reference/admin_auth.json
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: {toolchain: stable}
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  shared-quota:
    runs-on: ubuntu-latest
    services:
      redis:
        # Docker Hub's official image, from Google's Docker Hub mirror (Docker Hub outages failed this job).
        image: mirror.gcr.io/library/redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: {toolchain: stable}
      # The test is #[ignore]d without Redis; here it must run, exactly once.
      - name: Two replicas share one Redis allowance
        env:
          GATEWAY_TEST_REDIS_URL: redis://127.0.0.1:6379/
          GM_E2E_REQUIRED: "1"
        run: |
          set -euo pipefail
          cargo test --locked --lib gateway::quota::tests::two_independent_replicas_share_one_atomic_allowance -- --ignored --exact 2>&1 | tee quota.log
          if ! grep -q 'test result: ok. 1 passed' quota.log; then
            echo "::error::The shared quota test did not run."
            exit 1
          fi

  release-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release train (Genesis Mesh core leads every version)
        shell: bash
        run: |
            set -euo pipefail
            if [ -f VERSION ]; then
              version="$(tr -d '[:space:]' < VERSION)"
            else
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            fi
            # The contents API is read fresh; raw.githubusercontent.com caches VERSION for minutes after a core merge.
            # A pull request is checked against the core branch of the same name when it
            # exists: the core's release/X.Y.Z while the train's release PRs are open, so
            # they pass together. The core still merges first: a push to main or a tag
            # build reads the core's main, and a tag must also match a core tag.
            core_ref=main
            if [ -n "${GITHUB_HEAD_REF:-}" ] && git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$GITHUB_HEAD_REF" > /dev/null; then
              core_ref="$GITHUB_HEAD_REF"
            fi
            # A branch name is a query value: encoded, so '#', '&' or '+' in it cannot change the request.
            ref_query="$(jq -rn --arg ref "$core_ref" '$ref | @uri')"
            core="$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/GenesisMeshLabs/genesismesh/contents/VERSION?ref=$ref_query" | tr -d '[:space:]')"
            if [ "$(printf '%s\n%s\n' "$version" "$core" | sort -V | tail -n 1)" != "$core" ]; then
              echo "::error::Version $version is ahead of the Genesis Mesh core ($core). The core leads every coordinated version; see genesismesh docs/development/versioning.md."
              exit 1
            fi
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match version $version."
                exit 1
              fi
              # The core release is tagged first, even when the core's main already names the version.
              if ! git ls-remote --exit-code --tags https://github.com/GenesisMeshLabs/genesismesh.git "refs/tags/v$version" > /dev/null; then
                echo "::error::The Genesis Mesh core has no tag v$version (core main is $core). Release the core first."
                exit 1
              fi
            fi
            echo "Release train verified: $version (core $core)"
