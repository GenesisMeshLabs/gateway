name: Security container and secret scan
on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Build and export runtime
        run: |
          mkdir -p reports source
          git archive HEAD | tar -x -C source
          docker build -t gateway-security .
          docker save gateway-security -o reports/image.tar
      - name: Scan source secrets and configuration
        run: |
          docker run --rm -v "$PWD/source:/source:ro" -v "$PWD/reports:/reports" aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 fs --scanners vuln,secret,misconfig --format json --output /reports/source.json /source
          jq -e '[.Results[]? | .Vulnerabilities[]?] | length == 0' reports/source.json
      - name: Scan runtime and enforce high/critical gate
        run: |
          docker run --rm -v "$PWD/reports:/reports" aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --input /reports/image.tar --scanners vuln,secret --format json --output /reports/image.json
          jq -e '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' reports/image.json
          jq -e '[.Results[]? | .Secrets[]?] | length == 0' reports/image.json reports/source.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: reports/*.json
          retention-days: 90
