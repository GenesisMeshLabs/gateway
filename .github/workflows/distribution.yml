name: Build distribution artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  release-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release train (Genesis Mesh core leads every version)
        shell: bash
        run: |
            set -euo pipefail
            if [ -f VERSION ]; then
              version="$(tr -d '[:space:]' < VERSION)"
            else
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            fi
            # The contents API is read fresh; raw.githubusercontent.com caches VERSION for minutes after a core merge.
            core="$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/GenesisMeshLabs/genesismesh/contents/VERSION?ref=main" | tr -d '[:space:]')"
            if [ "$(printf '%s\n%s\n' "$version" "$core" | sort -V | tail -n 1)" != "$core" ]; then
              echo "::error::Version $version is ahead of the Genesis Mesh core ($core). The core leads every coordinated version; see genesismesh docs/development/versioning.md."
              exit 1
            fi
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match version $version."
                exit 1
              fi
              if [ "$version" != "$core" ] && ! git ls-remote --exit-code --tags https://github.com/GenesisMeshLabs/genesismesh.git "refs/tags/v$version" > /dev/null; then
                echo "::error::Release $version is not a Genesis Mesh core version (core is $core). Release the core first."
                exit 1
              fi
            fi
            echo "Release train verified: $version (core $core)"

  binaries:
    needs: release-train
    strategy:
      matrix:
        include:
          - {os: windows-latest, platform: windows-amd64, binary: genesis-mesh-gateway.exe}
          - {os: ubuntu-24.04, platform: linux-amd64-glibc239, binary: genesis-mesh-gateway}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: {toolchain: stable}
      - run: cargo test --locked
      - run: cargo build --locked --release --bin genesis-mesh-gateway --bin genesis-mesh-operator
      - shell: pwsh
        run: ./tools/package.ps1 -Binary target/release/${{ matrix.binary }} -Platform ${{ matrix.platform }} -Output dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - shell: pwsh
        run: |
          Get-ChildItem dist -Filter '*.zip' | ForEach-Object {
            cosign sign-blob --yes --bundle "$($_.FullName).sigstore.json" $_.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Artifact signing failed' }
            cosign verify-blob --bundle "$($_.FullName).sigstore.json" --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/distribution.yml@${{ github.ref }}" --certificate-oidc-issuer https://token.actions.githubusercontent.com $_.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed' }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  images:
    name: Gate and test the image (amd64), push by digest, archive
    needs: [release-train, binaries]   # cargo test passed on both platforms
    runs-on: ubuntu-latest
    # Job permissions replace the workflow's: declare everything this job needs.
    permissions:
      contents: read
      packages: write
      id-token: write   # the archive's Sigstore bundle
    env:
      IMAGE: ghcr.io/genesismeshlabs/genesis-mesh-gateway
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      TRIVY: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/distribution.yml@${{ github.ref }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      existing: ${{ steps.existing.outputs.digest }}
      digest: ${{ steps.pushed.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The core of the same release (its tag exists first: the core leads the
      # release train), for the Network Authority image and the harness.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          path: core
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'main' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      # BuildKit and the Dockerfile's base images (pinned by digest) come through
      # mirrors, falling back to Docker Hub: its outages failed every image job.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Fails closed: only a registry answer of "not found" counts as absent.
      # A dry run asks too, so the first release does not meet this check new.
      - name: Is this version already published?
        id: existing
        run: |
          if out="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' 2>&1)"; then
            found="$(printf '%s' "$out" | tr -d '"')"
            echo "::notice::$IMAGE:$VERSION is already published ($found)."
          elif printf '%s' "$out" | grep -q "$IMAGE:$VERSION: not found"; then
            found=""
            echo "::notice::$IMAGE:$VERSION is not published."
          else
            echo "::error::Cannot tell whether $IMAGE:$VERSION exists: $out"
            exit 1
          fi
          # Only a release completes an existing version; a dry run always builds and tests.
          if [ "$PUBLISH" = "true" ]; then echo "digest=$found" >> "$GITHUB_OUTPUT"; else echo "digest=" >> "$GITHUB_OUTPUT"; fi
      - name: Build for amd64 (gate and test before anything is pushed)
        if: steps.existing.outputs.digest == ''
        run: |
          docker buildx build --load -t genesis-mesh-gateway:candidate --platform linux/amd64 \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" .
          docker buildx build --load -t genesis-mesh:harness --build-arg VERSION="$(tr -d '[:space:]' < core/VERSION)" core
      - name: Vulnerability gate (no high or critical finding, no secret)
        if: steps.existing.outputs.digest == ''
        run: |
          mkdir -p reports
          docker save genesis-mesh-gateway:candidate -o reports/image.tar
          docker run --rm -v "$PWD/reports:/reports" "$TRIVY" image --quiet --input /reports/image.tar \
            --scanners vuln,secret --format json --output /reports/image-amd64.json
          rm reports/image.tar
          jq -e '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' reports/image-amd64.json
          jq -e '[.Results[]? | .Secrets[]?] | length == 0' reports/image-amd64.json
          jq -e '[.Results[]? | select(.Class == "os-pkgs")] | length > 0' reports/image-amd64.json   # the scan saw the image
      - name: Container smoke tests (gateway scenarios and the compose example)
        if: steps.existing.outputs.digest == ''
        run: |
          python core/scripts/container_smoke.py --image genesis-mesh:harness --gateway-image genesis-mesh-gateway:candidate \
            --compose-file core/deploy/compose/docker-compose.images.yml \
            --only gw-metadata --only gw-end-to-end --only gw-crl-refresh --only fed-two-sovereigns --only compose-example
      # One build, two exporters: the OCI archive for the release and, on a
      # tag, the same manifest pushed by digest (untagged) to GHCR. Both name the
      # image the same way, so their attestations, and digests, are identical
      # (the archive's index names it :latest; refer to it by digest).
      - id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: |
            type=oci,dest=/tmp/gateway-oci.tar,name=${{ env.IMAGE }}
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
      - name: The pushed image is the archived image and its amd64 layers were tested
        if: env.PUBLISH == 'true' && steps.existing.outputs.digest == ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          archived="$(tar -xOf /tmp/gateway-oci.tar index.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["manifests"][0]["digest"])')"
          if [ "$archived" != "$DIGEST" ]; then echo "::error::archive $archived, pushed $DIGEST"; exit 1; fi
          pushed="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json (index .Image "linux/amd64")}}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["rootfs"]["diff_ids"])')"
          tested="$(docker image inspect genesis-mesh-gateway:candidate --format '{{json .RootFS.Layers}}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin))')"
          if [ "$pushed" != "$tested" ]; then echo "::error::The pushed linux/amd64 layers differ from the tested image."; exit 1; fi
      - name: Pushed digest
        id: pushed
        if: env.PUBLISH == 'true' && steps.existing.outputs.digest == ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      # Completing an already published version: the release gets the
      # published image itself, exported with its digests.
      - name: Export the published image (already published)
        if: steps.existing.outputs.digest != ''
        env:
          DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          skopeo copy --all --preserve-digests "docker://$IMAGE@$DIGEST" oci-archive:/tmp/gateway-oci.tar
          archived="$(tar -xOf /tmp/gateway-oci.tar index.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["manifests"][0]["digest"])')"
          if [ "$archived" != "$DIGEST" ]; then echo "::error::exported $archived, published $DIGEST"; exit 1; fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify the archive
        run: |
          cd /tmp && sha256sum gateway-oci.tar > gateway-oci.tar.sha256
          cosign sign-blob --yes --bundle /tmp/gateway-oci.tar.sigstore.json /tmp/gateway-oci.tar
          cosign verify-blob --bundle /tmp/gateway-oci.tar.sigstore.json --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com /tmp/gateway-oci.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-multiarch-oci
          path: /tmp/gateway-oci.tar*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.existing.outputs.digest == ''
        with:
          name: image-security-report-amd64
          path: reports/image-amd64.json
          retention-days: 90
          if-no-files-found: ignore

  images-arm64:
    name: Gate and test the arm64 image (native)
    needs: images
    if: needs.images.outputs.existing == ''
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/genesismeshlabs/genesis-mesh-gateway
      VERSION: ${{ needs.images.outputs.version }}
      DIGEST: ${{ needs.images.outputs.digest }}
      TRIVY: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          path: core
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'main' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}
      - name: Log in to GHCR
        if: env.DIGEST != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release tests the arm64 variant it pushed; a dry run builds it here.
      - name: The arm64 images
        run: |
          if [ -n "$DIGEST" ]; then
            docker pull --platform linux/arm64 "$IMAGE@$DIGEST"
            docker tag "$IMAGE@$DIGEST" genesis-mesh-gateway:candidate
          else
            docker build -t genesis-mesh-gateway:candidate --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" .
          fi
          arch="$(docker image inspect genesis-mesh-gateway:candidate --format '{{.Architecture}}')"
          if [ "$arch" != "arm64" ]; then echo "::error::expected an arm64 image, got $arch"; exit 1; fi
          docker build -t genesis-mesh:harness --build-arg VERSION="$(tr -d '[:space:]' < core/VERSION)" core
      - name: Vulnerability gate (no high or critical finding, no secret)
        run: |
          mkdir -p reports
          docker save genesis-mesh-gateway:candidate -o reports/image.tar
          docker run --rm -v "$PWD/reports:/reports" "$TRIVY" image --quiet --input /reports/image.tar \
            --scanners vuln,secret --format json --output /reports/image-arm64.json
          rm reports/image.tar
          jq -e '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' reports/image-arm64.json
          jq -e '[.Results[]? | .Secrets[]?] | length == 0' reports/image-arm64.json
          jq -e '[.Results[]? | select(.Class == "os-pkgs")] | length > 0' reports/image-arm64.json   # the scan saw the image
      - name: Container smoke tests (gateway scenarios)
        run: |
          python core/scripts/container_smoke.py --image genesis-mesh:harness --gateway-image genesis-mesh-gateway:candidate \
            --only gw-metadata --only gw-end-to-end --only gw-crl-refresh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-security-report-arm64
          path: reports/image-arm64.json
          retention-days: 90
          if-no-files-found: ignore

  images-publish:
    name: Sign, verify and tag the image
    needs: [images, images-arm64]
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.images.result == 'success'
      && (needs.images-arm64.result == 'success' || (needs.images-arm64.result == 'skipped' && needs.images.outputs.existing != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/genesismeshlabs/genesis-mesh-gateway
      VERSION: ${{ needs.images.outputs.version }}
      NEW_DIGEST: ${{ needs.images.outputs.digest }}
      EXISTING: ${{ needs.images.outputs.existing }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/distribution.yml@${{ github.ref }}
    outputs:
      digest: ${{ steps.sign.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # release tags decide the floating tags
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          path: core
          ref: ${{ github.ref_name }}
      # BuildKit and the Dockerfile's base images (pinned by digest) come through
      # mirrors, falling back to Docker Hub: its outages failed every image job.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify the digest
        id: sign
        run: |
          if [ -n "$EXISTING" ]; then
            digest="$EXISTING"
          else
            digest="$NEW_DIGEST"
            cosign sign --yes --recursive "$IMAGE@$digest"
          fi
          cosign verify "$IMAGE@$digest" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Tag (never replace a published version)
        run: |
          tags="$(python3 core/scripts/image_tags.py "$VERSION" --tags-from-git)"
          if ! printf '%s\n' "$tags" | grep -qx "$VERSION"; then echo "::error::no tags computed for $VERSION: '$tags'"; exit 1; fi
          for tag in $tags; do
            if out="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest.Digest}}' 2>&1)"; then
              current="$(printf '%s' "$out" | tr -d '"')"
            elif printf '%s' "$out" | grep -q "$IMAGE:$tag: not found"; then
              current=""
            else
              echo "::error::Cannot read $IMAGE:$tag: $out"
              exit 1
            fi
            if [ "$current" = "$DIGEST" ]; then
              echo "$IMAGE:$tag already points at $DIGEST"
            elif [ "$tag" = "$VERSION" ] && [ -n "$current" ]; then
              echo "::error::$IMAGE:$VERSION is $current, not $DIGEST. Published tags are immutable; ship a new patch version."
              exit 1
            else
              docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE@$DIGEST"
              echo "Tagged $IMAGE:$tag -> $DIGEST"
            fi
          done

  release:
    # always(): on the resume path the arm64 job is skipped, which would skip
    # every job after it in the chain.
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.binaries.result == 'success' && needs.images.result == 'success'
      && needs.images-publish.result == 'success'
    needs: [binaries, images, images-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gateway-*
          path: artifacts
          merge-multiple: true
      - name: Create or complete the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          IMAGE: ghcr.io/genesismeshlabs/genesis-mesh-gateway
          VERSION: ${{ needs.images.outputs.version }}
          DIGEST: ${{ needs.images-publish.outputs.digest }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --repo "$REPOSITORY" --verify-tag --generate-notes --latest
          fi
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json body --jq .body > notes.md
          if ! grep -q "$DIGEST" notes.md; then
            {
              echo
              echo "### Container image"
              echo
              echo '```'
              echo "docker pull $IMAGE:$VERSION"
              echo "# $IMAGE@$DIGEST"
              echo '```'
            } >> notes.md
            gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --notes-file notes.md
          fi
