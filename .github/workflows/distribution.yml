name: Build distribution artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  release-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release train (Genesis Mesh core leads every version)
        shell: bash
        run: |
            set -euo pipefail
            if [ -f VERSION ]; then
              version="$(tr -d '[:space:]' < VERSION)"
            else
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            fi
            # The contents API is read fresh; raw.githubusercontent.com caches VERSION for minutes after a core merge.
            core="$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/GenesisMeshLabs/genesismesh/contents/VERSION?ref=main" | tr -d '[:space:]')"
            if [ "$(printf '%s\n%s\n' "$version" "$core" | sort -V | tail -n 1)" != "$core" ]; then
              echo "::error::Version $version is ahead of the Genesis Mesh core ($core). The core leads every coordinated version; see genesismesh docs/development/versioning.md."
              exit 1
            fi
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match version $version."
                exit 1
              fi
              if [ "$version" != "$core" ] && ! git ls-remote --exit-code --tags https://github.com/GenesisMeshLabs/genesismesh.git "refs/tags/v$version" > /dev/null; then
                echo "::error::Release $version is not a Genesis Mesh core version (core is $core). Release the core first."
                exit 1
              fi
            fi
            echo "Release train verified: $version (core $core)"

  binaries:
    needs: release-train
    strategy:
      matrix:
        include:
          - {os: windows-latest, platform: windows-amd64, binary: genesis-mesh-gateway.exe}
          - {os: ubuntu-24.04, platform: linux-amd64-glibc239, binary: genesis-mesh-gateway}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: {toolchain: stable}
      - run: cargo test --locked
      - run: cargo build --locked --release --bin genesis-mesh-gateway --bin genesis-mesh-operator
      - shell: pwsh
        run: ./tools/package.ps1 -Binary target/release/${{ matrix.binary }} -Platform ${{ matrix.platform }} -Output dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - shell: pwsh
        run: |
          Get-ChildItem dist -Filter '*.zip' | ForEach-Object {
            cosign sign-blob --yes --bundle "$($_.FullName).sigstore.json" $_.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Artifact signing failed' }
            cosign verify-blob --bundle "$($_.FullName).sigstore.json" --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/distribution.yml@${{ github.ref }}" --certificate-oidc-issuer https://token.actions.githubusercontent.com $_.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed' }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  images:
    needs: release-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/gateway-oci.tar
          sbom: true
          provenance: mode=max
      - run: cd /tmp && sha256sum gateway-oci.tar > gateway-oci.tar.sha256
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: |
          cosign sign-blob --yes --bundle /tmp/gateway-oci.tar.sigstore.json /tmp/gateway-oci.tar
          cosign verify-blob --bundle /tmp/gateway-oci.tar.sigstore.json --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/distribution.yml@${{ github.ref }}" --certificate-oidc-issuer https://token.actions.githubusercontent.com /tmp/gateway-oci.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-multiarch-oci
          path: /tmp/gateway-oci.tar*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gateway-*
          path: artifacts
          merge-multiple: true
      - run: gh release create "$RELEASE_TAG" artifacts/* --repo "$REPOSITORY" --verify-tag --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
